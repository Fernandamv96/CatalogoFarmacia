{% extends 'farmacia/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{% if object %}Editar Producto{% else %}Crear Producto{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            <input 
                                type="{{ field.field.widget.input_type|default:'text' }}" 
                                name="{{ field.name }}" 
                                id="{{ field.auto_id }}" 
                                class="form-control {% if field.errors %}is-invalid{% endif %}" 
                                value="{{ field.value|default_if_none:'' }}"
                            >
                            {% if field.errors %}
                                <div class="invalid-feedback">
                                    {{ field.errors.0 }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'catalogo_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

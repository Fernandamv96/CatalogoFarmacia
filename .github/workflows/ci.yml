name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt ruff==0.17.0

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (Django)
        run: python manage.py test

      - name: Chequeos de despliegue
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-solo-para-chequeos-no-es-un-secreto-real-0123456789abcdefghijklmnopqrstuvwxyz
        run: python manage.py check --deploy --fail-level ERROR

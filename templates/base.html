{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060f">
    <title>{% block title %}Catálogo{% endblock %} · Farmacia Central</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'farmacia/css/app.css' %}">
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <nav class="nav">
        <div class="container">
            <a class="brand" href="{% url 'catalogo_list' %}">
                <span class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                </span>
                Farmacia Central
            </a>
            <div class="nav-links">
                <a class="nav-link {% if request.resolver_match.url_name == 'catalogo_list' %}active{% endif %}" href="{% url 'catalogo_list' %}">
                    <span>Catálogo</span>
                </a>
                <a class="nav-link {% if request.resolver_match.url_name == 'catalogo_create' %}active{% endif %}" href="{% url 'catalogo_create' %}">
                    + <span>Nuevo</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">© {% now "Y" %} Farmacia Central · Catálogo de productos</div>
    </footer>

    {% if messages %}
    <div class="toasts" role="status" aria-live="polite">
        {% for message in messages %}
        <div class="toast">
            <span class="toast-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            {{ message }}
            <button class="toast-close" type="button" aria-label="Cerrar">×</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <script src="{% static 'farmacia/js/app.js' %}" defer></script>
</body>
</html>
